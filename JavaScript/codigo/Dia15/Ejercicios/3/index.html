<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de comentarios</title>
</head>
<body>
    <h1>Sistema de comentarios</h1>
    <label for="idPost">Introducir ID del Post: </label>
    <input id="idPost" type="number">
    <button id="btnBuscar">Buscar Post</button>
    <p>Título del Post: <span id="tituloSpan"></span></p>
    <p>Contenido del Post: <span id="contenidoSpan"></span></p>
    <button id="btnComentarios">Obtener comentarios del Post</button>
    <ul id="listaComentarios"></ul>
    <button id="btnPublicar">Publcar Comentario</button>
    <br><br><hr><br><br>
    <div id="contenedor"></div>
</body>
<script src="script.js"></script>
</html>
