<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeAPI</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>API de Pokemon</h1>
    <h2>Consulta información de tus pokemones favoritos</h2>
    <label for="nombre">Nombre de Pokemon: </label>
    <input id="nombre" type="text">
    <hr>
    <button id="btnBuscar">Buscar Pokemon</button>
    <button id="btnAleatorio">Buscar Pokemon Aleatorio</button>
    <h3>Nombre: <span id="nombreSpan"></span></h3>
    <p>Habilidades</p>
    <ul id="listaHabilidades"></ul>
    <p>Experiencia base: <span id="experienciaSpan"></span></p>
    <div id="contenedor"></div>
    <p>Peso: <span id="pesoSpan"></span></p>
    <p>Altura: <span id="alturaSpan"></span></p>
    <h3>Tipo</h3>
    <ul id="listaTipos"></ul>
</body>
<script src="script.js"></script>
</html>
