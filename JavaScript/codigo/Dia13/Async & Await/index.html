<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async/Await</title>
</head>
<body>
    
</body>
<script>
    //creamos función asíncrona con async y await
    async function obtenerDatos() {
        let respuesta = await fetch("https://dragonball-api.com/api/characters/1")
        let datos = await respuesta.json() //parcheamos en formato json;
        console.log(datos)
    }
    obtenerDatos();
    console.log("El código sigue");

    //otro ejemplo más complejo
    async function obtenerTodo() {
        console.log("Este código está al comienzo")
        let respuestaGasolina = await fetch("https://api.datos.gob.mx/v1/precio.gasolina.publico");
        let datosGasolina = await respuestaGasolina.json();

        console.log("Este código esta al medio")
        let respuestaDolar = await fetch("https://open.er-api.com/v6/latest/USD");
        let datosDolar =  await respuestaDolar.json();
        console.log(datosGasolina,datosDolar)
        console.log("Este código esta al final")
    }   
    obtenerTodo();
</script>
</html>
